name: Sincronizar SharePoint List

on:
  schedule:
    # A cada 10 minutos. O GitHub não garante precisão exata do horário
    # (pode atrasar alguns minutos em picos de uso), mas roda sozinho.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba "Actions" no GitHub

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de sincronização
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        run: |
          curl -sf -X POST "https://cadastro-insumos.vercel.app/api/sincronizacao/sharepoint" \
            -H "X-Sync-Key: $SYNC_API_KEY"
