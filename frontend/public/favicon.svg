  <path d="M296 122 c-4 -14 6 -26 20 -26 h48 c14 0 24 12 20 26" fill="#f4c11f" stroke="#0a0a0a" stroke-width="12" stroke-linejoin="round"/>
  <line x1="298" y1="176" x2="404" y2="176" stroke="#0a0a0a" stroke-width="12" stroke-linecap="round"/>

  <!-- caixa (marrom claro com etiqueta rosa) -->
